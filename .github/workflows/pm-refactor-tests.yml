name: PM refactor regression tests

on:
  push:
    branches:
      - fix/pm-obligations-semantic-model
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile PM modules
        run: python -m compileall -q agents tests/test_founder_obligations.py
      - name: Run PM refactor regressions
        run: python -m pytest -q tests/test_founder_obligations.py
