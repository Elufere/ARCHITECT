name: Backend tests

on:
  push:
    branches:
      - feature/model-driven-discovery
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run planner fallback regressions
        run: >
          python -m pytest -q
          tests/test_discovery_threads.py
          tests/test_frontier_stopping_semantics.py
          -k "bounded_planner_fallback_releases_active_thread_to_foundational_inquiries
          or planner_can_recover_when_only_terminally_blocked_inquiries_remain
          or planner_still_fails_for_unexpected_candidate_blockers
          or terminally_blocked_inquiries_allow_prd_confirmation
          or unexpectedly_blocked_inquiries_do_not_allow_prd_confirmation"

      - name: Run backend suite
        env:
          OPENAI_API_KEY: test-key-not-for-network-calls
        run: python -m pytest -q
